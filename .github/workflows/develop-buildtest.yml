name: develop-buildtest

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build_test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm ci

      - name: Create .env File
        env:
          PREFIX: 'NEXT_PUBLIC_'
          SECRETS: ${{ toJson(secrets) }}
        run: |
          touch .env && \
          jq -r 'to_entries|map("\(.key)=\(.value|tostring)")|.[]' <<< "$SECRETS" | grep $PREFIX > .env

      - name: Build
        run: npm run build
